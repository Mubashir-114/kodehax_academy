{% extends "user/base.html" %}

{% block title %}Student Login{% endblock %}
{% block extra_head %}
<style>
    .auth-wrap {
        max-width: 1120px;
        margin: 0 auto;
    }

    .auth-card {
        background: linear-gradient(180deg, #141833 0%, #0d1026 100%);
        border: 1px solid #2a2d4b;
        border-radius: 1.2rem;
        box-shadow: 0 26px 55px rgba(2, 4, 12, 0.5);
    }

    .auth-badge {
        border: 1px solid #353a66;
        background: #171a34;
        color: #c2c6eb;
        border-radius: 999px;
        padding: 0.35rem 0.7rem;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 700;
    }

    .auth-btn {
        width: 100%;
        border-radius: 1rem;
        padding: 0.85rem 1rem;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(90deg, #524dd3 0%, #6e68e3 52%, #8e89f1 100%);
        border: 1px solid rgba(142, 137, 241, 0.45);
        transition: transform 160ms ease, filter 160ms ease;
    }

    .auth-btn:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
    }

    .auth-link {
        color: #a9adff;
        text-underline-offset: 2px;
    }

    .auth-link:hover {
        color: #c8cbff;
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap reveal">
    <div class="auth-card p-7 md:p-8">
        <p class="auth-badge text-center mb-3 inline-flex">Welcome Back</p>
        <h2 class="text-2xl font-black text-center mb-6 text-white">Student Login</h2>

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            {{ form.username }}
            {{ form.password }}

            <button class="auth-btn">Login as Student</button>
        </form>

        <p class="text-center text-sm mt-4 text-slate-300">
            <a href="{% url 'forgot_password' %}" class="auth-link">Forgot password?</a>
        </p>

        <p class="text-center text-sm mt-4 text-slate-300">
            Don't have an account?
            <a href="{% url 'student_register' %}" class="auth-link">Register</a>
        </p>
    </div>
</div>
{% endblock %}
