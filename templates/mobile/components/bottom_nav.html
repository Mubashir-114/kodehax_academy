    <div class="mx-auto flex max-w-[480px] items-center justify-between gap-1 px-3 py-2">
        <a href="{% url 'student_dashboard' %}" class="group flex min-w-0 flex-1 flex-col items-center rounded-2xl px-2 py-2 text-[11px] transition {% if view_name == 'student_dashboard' or view_name == 'student_class_detail' %}text-teal-700 bg-teal-50{% else %}text-slate-500 hover:text-slate-700{% endif %}">
            <span class="mb-1 h-1.5 w-8 rounded-full {% if view_name == 'student_dashboard' or view_name == 'student_class_detail' %}bg-teal-500{% else %}bg-transparent group-hover:bg-slate-300{% endif %}"></span>
            Home
        </a>
        <a href="{% url 'view_assignments' %}" class="group flex min-w-0 flex-1 flex-col items-center rounded-2xl px-2 py-2 text-[11px] transition {% if view_name == 'view_assignments' or view_name == 'submit_assignment' or view_name == 'take_quiz_assignment' or view_name == 'submit_code_assignment' %}text-teal-700 bg-teal-50{% else %}text-slate-500 hover:text-slate-700{% endif %}">

            Courses
        </a>
        <a href="{% url 'daily_challenges_today' %}" class="group flex min-w-0 flex-1 flex-col items-center rounded-2xl px-2 py-2 text-[11px] transition {% if view_name == 'daily_challenges_today' or view_name == 'daily_challenge_workspace' %}text-teal-700 bg-teal-50{% else %}text-slate-500 hover:text-slate-700{% endif %}">
            <span class="mb-1 h-1.5 w-8 rounded-full {% if view_name == 'daily_challenges_today' or view_name == 'daily_challenge_workspace' %}bg-teal-500{% else %}bg-transparent group-hover:bg-slate-300{% endif %}"></span>
            Challenge
        </a>
        <a href="{% url 'student_performance_dashboard' %}" class="group flex min-w-0 flex-1 flex-col items-center rounded-2xl px-2 py-2 text-[11px] transition {% if view_name == 'student_performance_dashboard' %}text-teal-700 bg-teal-50{% else %}text-slate-500 hover:text-slate-700{% endif %}">
            <span class="mb-1 h-1.5 w-8 rounded-full {% if view_name == 'student_performance_dashboard' %}bg-teal-500{% else %}bg-transparent group-hover:bg-slate-300{% endif %}"></span>
            Alerts
        </a>
        <a href="{% url 'student_profile' %}" class="group flex min-w-0 flex-1 flex-col items-center rounded-2xl px-2 py-2 text-[11px] transition {% if view_name == 'student_profile' or view_name == 'edit_student_profile' %}text-teal-700 bg-teal-50{% else %}text-slate-500 hover:text-slate-700{% endif %}">
            <span class="mb-1 h-1.5 w-8 rounded-full {% if view_name == 'student_profile' or view_name == 'edit_student_profile' %}bg-teal-500{% else %}bg-transparent group-hover:bg-slate-300{% endif %}"></span>
            Profile
        </a>
